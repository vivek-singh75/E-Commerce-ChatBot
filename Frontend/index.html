<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopSphere Customer Support</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080b10;
            --panel: #0d1117;
            --panel-light: #151a22;
            --border: #252c37;
            --text: #f5f7fa;
            --muted: #8d96a5;
            --yellow: #ffbf00;
            --yellow-dark: #e6a900;
            --green: #22c55e;
            --user-msg: #1c2531;
            --bot-msg: #151b24;
        }

        body {
            font-family: Inter, Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #161d27 0%,
                    #080b10 45%,
                    #05070a 100%
                );
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        /* ==============================
           CHAT CONTAINER
        ============================== */

        .chat-container {
            width: min(1100px, 100%);
            height: 90vh;
            max-height: 850px;
            min-height: 600px;

            background: rgba(13, 17, 23, 0.95);

            border: 1px solid #303844;
            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(255, 255, 255, 0.02);

            display: flex;
            flex-direction: column;
        }

        /* ==============================
           HEADER
        ============================== */

        .chat-header {
            height: 105px;
            padding: 20px 28px;

            display: flex;
            align-items: center;
            gap: 17px;

            background: #0b0f14;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .logo {
            width: 58px;
            height: 58px;

            border-radius: 50%;

            background: var(--yellow);
            color: #080808;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;
            font-weight: 800;

            box-shadow:
                0 0 25px rgba(255, 191, 0, 0.15);
        }

        .header-content {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .header-title {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;

            color: var(--muted);
            font-size: 13px;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;

            background: var(--green);

            box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
        }

        /* ==============================
           CHAT BODY
        ============================== */

        .chat-body {
            flex: 1;
            overflow-y: auto;

            padding: 30px;

            display: flex;
            flex-direction: column;
            gap: 20px;

            scroll-behavior: smooth;
        }

        .chat-body::-webkit-scrollbar {
            width: 7px;
        }

        .chat-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: #29313d;
            border-radius: 10px;
        }

        /* ==============================
           MESSAGE
        ============================== */

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 13px;

            max-width: 82%;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;

            flex-shrink: 0;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 15px;
            font-weight: 700;
        }

        .bot-avatar {
            background: var(--yellow);
            color: #090909;
        }

        .user-avatar {
            background: #27303d;
            color: #ffffff;
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .message-row.user .message-content {
            align-items: flex-end;
        }

        .message {
            padding: 14px 17px;

            border-radius: 16px;

            font-size: 15px;
            line-height: 1.55;

            color: #e9edf2;

            border: 1px solid var(--border);
        }

        .bot-message {
            background: var(--bot-msg);

            border-top-left-radius: 4px;
        }

        .user-message {
            background: var(--user-msg);

            border-top-right-radius: 4px;

            border-color: #303b4a;
        }

        .message-time {
            color: #626c79;
            font-size: 11px;
            padding: 0 3px;
        }

        /* ==============================
           TYPING INDICATOR
        ============================== */

        .typing {
            display: none;

            align-items: center;
            gap: 13px;
        }

        .typing.show {
            display: flex;
        }

        .typing-bubble {
            background: var(--bot-msg);

            border: 1px solid var(--border);

            border-radius: 15px;
            border-top-left-radius: 4px;

            padding: 13px 17px;

            display: flex;
            gap: 5px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #8d96a5;

            animation: typing 1.2s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* ==============================
           SUGGESTIONS
        ============================== */

        .suggestions-wrapper {
            padding: 0 28px 16px;

            flex-shrink: 0;
        }

        .suggestions {
            display: flex;
            gap: 10px;

            overflow-x: auto;
            padding: 2px;
        }

        .suggestions::-webkit-scrollbar {
            display: none;
        }

        .suggestion {
            flex-shrink: 0;

            background: transparent;

            border: 1px solid #5d4c17;
            color: #f5cc58;

            padding: 10px 15px;

            border-radius: 25px;

            font-size: 13px;
            font-weight: 500;

            cursor: pointer;

            transition: all 0.2s ease;
        }

        .suggestion:hover {
            background: rgba(255, 191, 0, 0.09);
            border-color: var(--yellow);
            color: #ffd75a;

            transform: translateY(-1px);
        }

        /* ==============================
           INPUT AREA
        ============================== */

        .input-area {
            padding: 17px 22px 21px;

            border-top: 1px solid var(--border);

            background: #0a0e13;

            display: flex;
            gap: 12px;

            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;

            min-height: 58px;

            display: flex;
            align-items: center;

            background: #11161e;

            border: 1px solid #303844;
            border-radius: 15px;

            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #6a5619;
        }

        .attach-btn {
            width: 50px;
            height: 100%;

            border: none;
            background: transparent;

            color: #8c96a5;

            font-size: 22px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            border-right: 1px solid #2a3039;
        }

        .attach-btn:hover {
            color: var(--yellow);
        }

        #messageInput {
            flex: 1;

            height: 56px;

            border: none;
            outline: none;

            background: transparent;

            color: #ffffff;

            padding: 0 16px;

            font-size: 15px;

            font-family: inherit;
        }

        #messageInput::placeholder {
            color: #687280;
        }

        .send-btn {
            width: 58px;
            height: 58px;

            border: none;
            border-radius: 15px;

            background: var(--yellow);
            color: #080808;

            font-size: 22px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: all 0.2s ease;

            box-shadow:
                0 7px 20px rgba(255, 191, 0, 0.12);
        }

        .send-btn:hover {
            background: #ffd04a;
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(255, 191, 0, 0.2);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        /* ==============================
           EMPTY / WELCOME
        ============================== */

        .welcome {
            margin-top: 5px;
        }

        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 700px) {

            body {
                padding: 0;
            }

            .chat-container {
                width: 100%;
                height: 100vh;
                max-height: none;
                border-radius: 0;
                border: none;
            }

            .chat-header {
                height: 85px;
                padding: 15px 18px;
            }

            .logo {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }

            .header-title {
                font-size: 17px;
            }

            .header-status {
                font-size: 11px;
            }

            .chat-body {
                padding: 20px 16px;
            }

            .message-row {
                max-width: 92%;
            }

            .message-avatar {
                width: 34px;
                height: 34px;
            }

            .message {
                font-size: 14px;
            }

            .suggestions-wrapper {
                padding: 0 16px 12px;
            }

            .input-area {
                padding: 12px;
            }

            .attach-btn {
                width: 42px;
            }

            .send-btn {
                width: 52px;
                height: 52px;
            }

            #messageInput {
                height: 50px;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- ============================
         HEADER
    ============================= -->

    <header class="chat-header">

        <div class="logo">
            S
        </div>

        <div class="header-content">

            <div class="header-title">
                ShopSphere Customer Support
            </div>

            <div class="header-status">

                <span class="status-dot"></span>

                <span>
                    AI assistant grounded in company policies
                </span>

            </div>

        </div>

    </header>


    <!-- ============================
         CHAT BODY
    ============================= -->

    <main class="chat-body" id="chatBody">

        <!-- Initial Bot Message -->

        <div class="message-row">

            <div class="message-avatar bot-avatar">
                S
            </div>

            <div class="message-content">

                <div class="message bot-message">
                    Hi! 👋 I can help with returns, exchanges, shipping,
                    payments, refunds and orders. What would you like to know?
                </div>

                <div class="message-time">
                    Just now
                </div>

            </div>

        </div>


        <!-- Typing Indicator -->

        <div class="typing" id="typingIndicator">

            <div class="message-avatar bot-avatar">
                S
            </div>

            <div class="typing-bubble">

                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>

            </div>

        </div>

    </main>


    <!-- ============================
         SUGGESTIONS
    ============================= -->

    <div class="suggestions-wrapper">

        <div class="suggestions">

            <button
                class="suggestion"
                onclick="sendSuggestion('Can I return a product after 30 days?')">
                ↩ Return after 30 days?
            </button>

            <button
                class="suggestion"
                onclick="sendSuggestion('How long does a refund take?')">
                ▣ Refund time?
            </button>

            <button
                class="suggestion"
                onclick="sendSuggestion('Can I exchange my product?')">
                ⇄ Exchange size?
            </button>

            <button
                class="suggestion"
                onclick="sendSuggestion('How long does delivery take?')">
                🚚 Delivery time?
            </button>

        </div>

    </div>


    <!-- ============================
         INPUT AREA
    ============================= -->

    <div class="input-area">

        <div class="input-wrapper">

            <button
                class="attach-btn"
                title="Attach file"
                onclick="document.getElementById('fileInput').click()">
                📎
            </button>

            <input
                type="file"
                id="fileInput"
                hidden
            >

            <input
                type="text"
                id="messageInput"
                placeholder="Ask about your order or our policies..."
                autocomplete="off"
            >

        </div>

        <button
            class="send-btn"
            id="sendButton"
            onclick="sendMessage()"
            title="Send">
            ➤
        </button>

    </div>

</div>


<script>

    /* ========================================
       ELEMENTS
    ======================================== */

    const chatBody = document.getElementById("chatBody");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const typingIndicator = document.getElementById("typingIndicator");


    /* ========================================
       SEND MESSAGE
    ======================================== */

    async function sendMessage() {

        const message = messageInput.value.trim();

        if (!message) {
            return;
            console.log("message is empty")
        }

        // Add user message
        addMessage(message, "user");

        // Clear input
        messageInput.value = "";

        // Show typing
        showTyping();

        try {

            /*
             * YOUR BACKEND API
             *
             * Change this URL according to your backend route.
             */

            const response = await fetch(
                "http://localhost:3000/api/ai/userInput",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        userQuery: message
                    })
                }
            );


            if (!response.ok) {
                throw new Error("Server error");
            }


            const data = await response?.json();

            hideTyping();


            /*
             * Expected backend response:
             *
             * {
             *     "answer": "Your product can be returned..."
             * }
             *
             */
            console.log(data)

            const answer =
                data.matches ||
                "Sorry, I couldn't find an answer.";


            addMessage(answer, "bot");


        } catch (error) {

            console.error(error);

            hideTyping();

            addMessage(
                "Sorry, something went wrong while connecting to the support system.",
                "bot"
            );

        }

    }


    /* ========================================
       ADD MESSAGE
    ======================================== */

    function addMessage(text, type) {

        const row = document.createElement("div");

        row.className =
            type === "user"
                ? "message-row user"
                : "message-row";


        const avatar = document.createElement("div");

        avatar.className =
            type === "user"
                ? "message-avatar user-avatar"
                : "message-avatar bot-avatar";


        avatar.textContent =
            type === "user"
                ? "U"
                : "S";


        const content = document.createElement("div");

        content.className = "message-content";


        const message = document.createElement("div");

        message.className =
            type === "user"
                ? "message user-message"
                : "message bot-message";


        /*
         * textContent is used instead of innerHTML
         * to prevent HTML injection from user messages.
         */

        message.textContent = text;


        const time = document.createElement("div");

        time.className = "message-time";

        time.textContent = getCurrentTime();


        content.appendChild(message);
        content.appendChild(time);

        row.appendChild(avatar);
        row.appendChild(content);


        /*
         * Insert before typing indicator
         */

        chatBody.insertBefore(row, typingIndicator);


        scrollToBottom();

    }


    /* ========================================
       SUGGESTION
    ======================================== */

    function sendSuggestion(text) {

        messageInput.value = text;

        sendMessage();

    }


    /* ========================================
       TYPING
    ======================================== */

    function showTyping() {

        typingIndicator.classList.add("show");

        scrollToBottom();

    }


    function hideTyping() {

        typingIndicator.classList.remove("show");

    }


    /* ========================================
       SCROLL
    ======================================== */

    function scrollToBottom() {

        setTimeout(() => {

            chatBody.scrollTop =
                chatBody.scrollHeight;

        }, 50);

    }


    /* ========================================
       CURRENT TIME
    ======================================== */

    function getCurrentTime() {

        return new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    /* ========================================
       ENTER KEY
    ======================================== */

    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* ========================================
       AUTO FOCUS
    ======================================== */

    messageInput.focus();

</script>

</body>
</html>
